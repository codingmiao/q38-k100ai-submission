# ============================================================================
# 环境声明（B 赛道 · Qwen3.8-27B 高性能推理优化）
# 评审按此声明准备环境 → 安装依赖 → 启动模型 → 跑 Benchmark → 得到结果
# ============================================================================

hardware:
  accelerator: Hygon K100-AI
  arch: gfx928            # AMD CDNA2 兼容，120 CU
  count: 2                # TP2，卡 0,1
  vram_per_card_gb: 64
  hbm_bandwidth: ~0.73 TB/s (copy 实测)
  interconnect: RCCL P2P（TP2 all-reduce）

software:
  os: Ubuntu 22.04
  python: 3.10
  dtk: 2604              # 海光 DTK（ROCm 兼容）
  sglang: 0.5.12
  image: harbor.sourcefind.cn:5443/dcu/admin/base/sglang:0.5.12-ubuntu22.04-dtk2604-py3.10
  key_env:
    SGLANG_USE_LIGHTOP: 1
    SGLANG_ENABLE_SPEC_V2: 1
    SGLANG_USE_AITER_LINEAR_ATTN: 1
    SGLANG_USE_CAUSAL_CONV1D: 1
    SGLANG_USE_FUSED_TOPK_SOFTMAX: 1
    SGLANG_USE_MARLIN_W16A16_MOE: 0
    SGLANG_ROCM_USE_AITER_MOE: "False"
    SGLANG_USE_CUDA_IPC_TRANSPORT: 1
    SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: 1

model:
  name: Qwen3.8-27B
  checkpoint: Qwen3.8-27B-Channel-INT8-w8a8   # 官方 baseline 同款 Channel-INT8 权重
  path: /mydata/models/hy/Qwen3.8-27B-Channel-INT8-w8a8
  architecture: 64 层混合 = 48 层 GDN（gated delta net / 线性注意力，Mamba 式 O(1) 循环态）+ 16 层 full attention
  hidden: 5120
  vocab: 248320
  mtp_num_hidden_layers: 1
  quantization: w8a8_int8 (Channel-INT8)
  dtype: bfloat16

serving:
  framework: SGLang 0.5.12
  tp_size: 2
  attention_backend: fa3
  mm_attention_backend: fa3
  kv_cache_dtype: auto (bf16)
  context_length: 262144
  page_size: 64
  chunked_prefill_size: 16384
  cuda_graph_max_bs: 64
  mamba_scheduler_strategy: extra_buffer
  speculative:
    algorithm: EAGLE
    num_steps: 3
    eagle_topk: 1
    num_draft_tokens: 4
  mem_fraction_static: 0.80
  mamba_full_memory_ratio: 1.5
  keep_mm_feature_on_device: true
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  disable_custom_all_reduce: true
  port: 30011

# 提交配置（2026-09-28 最终复扫锁定）—— 三个独立 env 门控的代码级杠杆
optimization_levers:
  INT8TUNE: 1      # 0003 decode INT8 GEMM tuned-config 查表（M<=128）+ 0004 lightop zeros->empty
  PREFILLTUNE: 1   # 0006 prefill INT8 GEMM tuned-config 查表（M>=129）
  GDN_TUNE: 1      # 0007 GDN 线性注意力 prefill chunked-kernel tuned config
  DELAYER: 0       # prefill delayer 关（新 SLA TTFT<3s 下无用）

benchmark:
  harness: scripts/benchmark_official.py   # 官方固定 token 基准（forum d006a0e2, 2026-09-19）
  method: 固定随机 token ID, /v1/completions, stream=True, ignore_eos, max_tokens=1024,
          temperature=0, top_p=1, seed=0, cache_salt; 2 warmup + 3 measure rounds;
          requests/round = max(8, 2*concurrency)
  sla:
    # 判分口径 = 宽松 + 均值（组委会"取均值性能"，2026-10-08 用户拍板）
    judging_caliber: loose_mean
    loose_mean:   # 本提交判分口径（均值 TTFT/TPOT）
      4K_in_1K_out:  { ttft_mean: "<10s",  tpot_mean: "<80ms" }
      64K_in_1K_out: { ttft_mean: "<30s",  tpot_mean: "<100ms" }
    strict_p95:   # 论坛基线帖（d006a0e2）另一组更严口径，两口径 baseline 均 0/0
      4K_in_1K_out:  { ttft_p95: "<3s",  tpot_p95: "<50ms" }
      64K_in_1K_out: { ttft_p95: "<15s", tpot_p95: "<50ms" }
  concurrency_levels:
    4K_in_1K_out:  [1, 8, 16, 32, 64, 128]
    64K_in_1K_out: [1, 8, 16, 32]
  official_baseline_max_concurrency: { 4K: 0, 64K: 0 }
  max_concurrency_result:
    loose_mean: { 4K: 16, 64K: 1 }   # 本提交判分口径
    strict_p95: { 4K: 1,  64K: 0 }   # 严格口径对照
